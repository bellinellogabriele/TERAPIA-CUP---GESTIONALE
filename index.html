<style>
/* Layout: barra in alto con tab, griglia di card FIFA, pannelli per sondaggi/partite/classifica. Dark first. */
:root{--bg:#070d1c;--surf:#0e1731;--surf2:#17234b;--line:#27377a;--fg:#e9eeff;--mut:#93a0cf;

.tile{position:relative;aspect-ratio:16/11;border:0;border-radius:16px;color:#fff;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;background-size:cover;background-position:center;overflow:hidden;box-shadow:0 6px 18px #0005;transition:transform .15s,filter .15s;font:inherit}
.tile:hover{transform:translateY(-3px);filter:brightness(1.08)}.tile:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.tile .ti{font-size:28px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 2px 4px #0008)}
.tile .tt{font-family:var(--fd);font-size:23px;letter-spacing:.04em;text-transform:uppercase;line-height:1;text-shadow:0 2px 6px #000a;overflow-wrap:anywhere}
.tile .ts{font-size:12px;opacity:.92;margin-top:4px;text-shadow:0 1px 4px #000b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.edit{outline:2px dashed var(--teal);outline-offset:3px}.tile .pen{position:absolute;top:8px;right:8px;background:#000b;border-radius:999px;padding:3px 9px;font-size:12px}
.tile .tbd{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-style:normal;font-weight:700}
.tprev{max-width:260px;margin:12px 0}.tprev .tile{cursor:default}.tprev .tile:hover{transform:none;filter:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.sw{width:38px;height:38px;border-radius:10px;border:2px solid transparent;cursor:pointer;color:#fff;font-size:20px}.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--teal)}.sw.cu{background:conic-gradient(#ef4444,#f59e0b,#22c55e,#0ea5e9,#a78bfa,#ef4444)}
.pchip{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;border-radius:999px;padding:3px 6px;min-width:0}.pchip:hover{background:var(--surf2);color:var(--fg)}.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.pchip img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 10%;flex:none}.pchip img.pav{background:var(--surf2)}
.bcat{margin:0 0 10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);overflow:hidden}
.bh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.bh .bi{font-size:22px}.bh .bt{flex:1;font-weight:700;font-size:16px}.bh i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:20px;font-weight:700;line-height:1}
.bb{padding:2px 14px 14px}.bb h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.bcat .odd{border-color:color-mix(in srgb,var(--c) 55%,transparent)}.bcat .odd b{color:var(--c);filter:brightness(1.25)}.bcat .odd:not([disabled]):hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
button.it{background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;width:100%;text-align:left}.list .it.on{background:color-mix(in srgb,var(--blue) 18%,transparent)}
.vp{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.vp video,.vp iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vth{all:unset;cursor:pointer;display:block;width:100%;height:100%;position:relative}.vth img{width:100%;height:100%;object-fit:cover;display:block}.vth span{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:#e11d48;color:#fff;display:grid;place-items:center;font-size:24px;padding-left:4px;box-shadow:0 4px 18px #0008}
.vth:hover span{transform:scale(1.08)}
.rl{margin:8px 0 0;padding-left:20px;line-height:1.55}.rl li{margin:3px 0}.rh{margin:14px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.tl{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 6px}.score span,.sb span{text-align:center}
.card .lg{position:absolute;left:13%;top:44%;width:10.5cqw;height:auto;filter:drop-shadow(0 .6cqw .8cqw #0006)}
.tlp{display:flex;align-items:center;gap:10px;margin-top:6px}.tlp img{width:48px;height:48px;object-fit:contain;background:var(--surf2);border-radius:10px}
@media(max-width:760px){.top .chip{white-space:nowrap;font-size:16px!important;padding:6px 12px!important}.pchip{font-size:15px!important;gap:8px!important}.pchip span{max-width:88px}.pchip img,.pchip .av{width:44px!important;height:44px!important}.pchip .badge{display:none}.who{gap:6px!important}.brand img{height:60px!important}}
.back{margin:14px 0 0}
.lastres{display:block;margin:14px 0 0;background-size:cover;background-position:center;color:#fff;border-radius:20px;padding:22px 18px;text-align:center;box-shadow:0 8px 24px #0005}
.hg{flex:0 1 auto}.wallbox{flex:1 1 380px;min-width:min(100%,300px);background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px}
.fs{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.fs div{background:var(--surf2);border-radius:12px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:center}.fs i{font-style:normal;font-size:20px;grid-row:span 2}.fs span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}.fs b{font-size:14px;overflow-wrap:anywhere}
.wl h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}.wm{font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}.wm:last-of-type{border:0}.wx{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;padding:0 4px}
.lastres small{color:#ffffffcc;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:700}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:10px auto 6px;max-width:900px}.lastres .tl{width:min(100%,260px);height:150px;object-fit:contain;margin:0 auto 8px}.lastres .btn.o{background:#0006;color:#fff;border-color:#fff6}.sb b{font-family:var(--fd);font-size:44px;color:var(--gold);line-height:1;white-space:nowrap}.sb span{font-weight:700;overflow-wrap:anywhere}

.edv{position:fixed;inset:0;z-index:80;background:#000e;display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 10px 10px}
.edt{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.edt label{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}.edt input[type=range]{width:90px}
.edt button.on{background:var(--teal);color:#06201d;border-color:var(--teal)}
.edw{flex:1;min-height:0;overflow:auto;border-radius:12px;border:1px solid var(--line);background:conic-gradient(#8884 25%,#0000 0 50%,#8884 0 75%,#0000 0) 0 0/18px 18px,#161a2b;display:grid;place-items:center}
.edw canvas{touch-action:none;cursor:crosshair;display:block;margin:auto}
#edring{position:fixed;z-index:90;pointer-events:none;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000a;transform:translate(-50%,-50%)}
/* vetrina girevole */
.stage{position:relative;height:330px;margin-top:20px;border-radius:16px;overflow:hidden;border:1px solid var(--line);perspective:950px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;color:#fff;
background:radial-gradient(110% 80% at 50% 0,#22336a 0,#0d142b 58%,#070a16)}
.stage:active{cursor:grabbing}
.stage .bgname{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:clamp(56px,15vw,120px);text-transform:uppercase;white-space:nowrap;opacity:.06;pointer-events:none;overflow:hidden;padding:0 10px}
.stage .spot{position:absolute;left:50%;top:0;width:78%;height:100%;margin-left:-39%;clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);background:linear-gradient(#ffffff40,#ffffff00 85%);pointer-events:none}
.stage .disc,.stage .tick{position:absolute;left:50%;bottom:-62px;width:250px;height:250px;margin-left:-125px;border-radius:50%;transform:rotateX(74deg);pointer-events:none}
.stage .disc{background:radial-gradient(circle,#4fd1c533 0,#4fd1c50d 62%,#0000 70%),radial-gradient(circle,#0000 0 58%,#4fd1c5 59% 60.5%,#0000 62%);box-shadow:0 0 40px #4fd1c533}
.stage .tick{background:repeating-conic-gradient(#ffffff55 0 1.4deg,#0000 1.4deg 9deg);-webkit-mask:radial-gradient(circle,#0000 0 66%,#000 67% 74%,#0000 75%);mask:radial-gradient(circle,#0000 0 66%,#000 67% 74%,#0000 75%)}
.stage .fig{position:absolute;left:50%;bottom:63px;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.stage .fig i{position:absolute;inset:0;background:var(--img) center bottom/100% 100% no-repeat;display:block}
.stage .shd{position:absolute;left:50%;bottom:44px;width:150px;height:34px;margin-left:-75px;border-radius:50%;background:radial-gradient(ellipse,#000a 0,#0000 70%);pointer-events:none}
.stage .si{position:absolute;left:16px;top:12px;pointer-events:none}
.stage .si b{display:block;font-family:var(--fd);font-size:54px;line-height:.95;color:var(--gold)}.stage .si span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.stage .stcap{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;font-size:12px;color:#ffffffb0;pointer-events:none}
.stage .fig-ph{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);font-family:var(--fd);font-size:90px;font-weight:800;opacity:.25}

function perfTotals(){const out={};
  for(const m of S.matches){if(m.status!=='played'||typeof m.sa!=='number'||typeof m.sb!=='number')continue;
    for(const side of ['A','B']){for(const pid of (m[side]||[])){
      const t=out[pid]??={played:0,wins:0,draws:0,losses:0,goals:0,assists:0,own:0,pts:0};const st=(m.stats||{})[pid]||{};
      const mine=side==='A'?m.sa:m.sb,other=side==='A'?m.sb:m.sa;
      t.played++;t.goals+=st.g||0;t.assists+=st.a||0;t.own+=st.o||0;t[mine>other?'wins':mine===other?'draws':'losses']++;t.pts+=(st.g||0)+(st.a||0)-(st.o||0)+(mine>other?2:0);(t.rec??=[]).push({ts:matchTs(m)||0,v:mine>other?1:mine<other?-1:0,o:st.o||0})}}}
  return out}
function formBonus(t){if(!t||!t.rec||!t.rec.length)return 0;return t.rec.slice().sort((a,b)=>b.ts-a.ts).slice(0,2).reduce((x,r)=>x+r.v-r.o,0)}
function derive(){const perf=perfTotals(),vals={},voters={};
  for(const [uid,v] of Object.entries(S.ratings))for(const [pid,st] of Object.entries(v||{})){
    for(const k of SK)if(typeof st[k]==='number')((vals[pid]??={})[k]??=[]).push(st[k]);
    (voters[pid]??=new Set()).add(uid)}
  return S.players.map(p=>{const a=vals[p.id]||{},n=voters[p.id]?voters[p.id].size:0;
    const avg={};for(const k of SK)avg[k]=a[k]?a[k].reduce((x,y)=>x+y,0)/a[k].length:null;
    const w=WEIGHTS[p.role]||WEIGHTS.CEN;let sw=0,sv=0;for(const k of SK)if(avg[k]!=null){sw+=w[k];sv+=w[k]*avg[k]}
    const base=sw?Math.round(sv/sw):null,t=perf[p.id]||{played:0,wins:0,draws:0,losses:0,goals:0,assists:0,own:0,pts:0};
    const bonus=base==null?0:formBonus(t);
    return {...p,voters:n,unlocked:base!=null,stats:Object.fromEntries(SK.map(k=>[k,avg[k]==null?null:Math.round(avg[k])])),
      base,bonus,overall:base==null?null:Math.max(1,Math.min(99,base+bonus)),perf:t,mine:(S.ratings[S.me.id]||{})[p.id]||{}}})}

function splitBalanced(pl){const n=pl.length,ov=pl.map(p=>p.overall??50);
  if(n>16){const o=pl.map((_,i)=>i).sort((a,b)=>(ov[b]+Math.random()*2)-(ov[a]+Math.random()*2)),A=[],B=[];o.forEach((i,j)=>("ABBA"[j%4]==='A'?A:B).push(pl[i]));return [A,B]}
  const k=n>>1,st=pl.map(p=>SK.map(s=>p.stats[s]??50)),roles=pl.map(p=>p.role),tot={};Object.keys(ROLES).forEach(r=>tot[r]=roles.filter(x=>x===r).length);
  const idx=[...Array(n).keys()];function*comb(arr,m,s=0,cur=[]){if(cur.length===m){yield cur.slice();return}for(let i=s;i<=arr.length-(m-cur.length);i++){cur.push(arr[i]);yield*comb(arr,m,i+1,cur);cur.pop()}}
  const gen=n%2===0?[...comb(idx.slice(1),k-1)].map(c=>[0,...c]):comb(idx,k),scored=[];
  for(const a of gen){const sa=new Set(a),b=idx.filter(i=>!sa.has(i));const m=(arr,f)=>arr.reduce((s,i)=>s+f(i),0)/arr.length;
    let cost=Math.abs(m(a,i=>ov[i])-m(b,i=>ov[i]));SK.forEach((s,j)=>{cost+=.25*Math.abs(m(a,i=>st[i][j])-m(b,i=>st[i][j]))});
    for(const r of Object.keys(ROLES)){const ca=a.filter(i=>roles[i]===r).length;cost+=.8*Math.abs(ca-(tot[r]-ca))}scored.push([cost,a])}
  scored.sort((x,y)=>x[0]-y[0]);const a=scored[Math.floor(Math.random()*Math.min(3,scored.length))][1],sa=new Set(a);
  let ta=a.map(i=>pl[i]),tb=idx.filter(i=>!sa.has(i)).map(i=>pl[i]);if(Math.random()<.5)[ta,tb]=[tb,ta];return [ta,tb]}

const oddBtn=(mid,mk,pk,label,q,open)=>`<button class="odd" data-act="betPick" data-mid="${esc(mid)}" data-mk="${mk}" data-pk="${esc(pk)}" ${open&&S.me.id&&!S.ro?'':'disabled'}><span>${esc(label)}</span><b>${fnum(q)}</b></button>`;
function vBets(){const L=S.matches.filter(m=>S.odds[m.id]).sort((a,b)=>((a.status==='played')-(b.status==='played'))||(matchTs(a)||0)-(matchTs(b)||0));
  const mine=S.bets.filter(b=>b.uid===S.me.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)),c=S.me.id?credits(S.me.id):null;
  const sel=L.find(m=>m.id===S.betMatch)||L.find(m=>betsOpen(m))||L[0];
  const head=`<div class="title"><h2>Scommesse</h2>${c?`<div class="row"><span class="muted">Hai</span><b class="bal" style="font-size:34px">${c.balance}</b><span class="muted">crediti</span></div>`:''}</div>`;
  if(!sel)return head+`<div class="empty"><b>Nessuna quota disponibile</b>Le quote compaiono quando un admin fissa una partita, salva le squadre e le pubblica dalla scheda della partita.</div>`+myBetsHTML(mine);
  const od=S.odds[sel.id],M=od.m,open=betsOpen(sel),nm=id=>((S.players.find(p=>p.id===id))||{}).name||'?',why=sel.status==='played'?'Partita giocata':sel.betsClosed?'Scommesse chiuse dagli admin':(sel.at&&Date.now()>=new Date(sel.at).getTime())?'Partita iniziata: scommesse chiuse':'';
  const others=S.bets.filter(b=>b.matchId===sel.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const O=(mk,pk,l,q)=>oddBtn(sel.id,mk,pk,l,q,open),srt=(mk)=>Object.entries(M[mk]||{}).sort((a,b)=>a[1]-b[1]).map(([id,q])=>O(mk,id,nm(id),q)).join(''),bo=k=>(S.bcat&&k in S.bcat)?S.bcat[k]:k==='esito';
  const cats=[
   ['esito','Esito finale e doppia chance','#3b82f6','🏁',`<div class="odds">${[['1','Vince '+tn(sel,'A')],['X','Pareggio'],['2','Vince '+tn(sel,'B')]].map(([k,l])=>O('1x2',k,l,M.x12[k])).join('')}</div>`+(M.dc?`<div class="odds">${[['1X',tn(sel,'A')+' o pareggio'],['X2','Pareggio o '+tn(sel,'B')],['12','Vince una delle due']].map(([k,l])=>O('dc',k,l,M.dc[k])).join('')}</div>`:'')],
   ['ou','Under / Over gol totali','#10b981','⚽',M.ous?`<div class="odds">${Object.keys(M.ous).map(l=>O('ou2','under|'+l,'Under '+ln2(l),M.ous[l].under)+O('ou2','over|'+l,'Over '+ln2(l),M.ous[l].over)).join('')}</div>`:`<div class="odds">${O('ou','over','Più di '+M.ou.line,M.ou.over)}${O('ou','under','Meno di '+M.ou.line,M.ou.under)}</div>`],
   ['mg','Somma gol (multigol)','#f59e0b','🔢',M.mg?`<div class="odds">${Object.keys(M.mg).map(k=>O('mg',k,k+' gol',M.mg[k])).join('')}</div>`:''],
   ['cb','Combo: esito + Under/Over','#a855f7','🎯',M.cb?`<div class="odds">${Object.keys(M.cb).map(k=>O('cb',k,pickLabel({matchId:sel.id,market:'cb',pick:k}),M.cb[k])).join('')}</div>`:''],
   ['hc','Handicap (4+ gol di scarto)','#ef4444','💥',M.hc?`<div class="odds">${['1','2'].map(k=>O('hc',k,tn(sel,k==='1'?'A':'B')+' di 4+',M.hc[k])).join('')}</div>`:''],
   ['pl','Giocatori: segna / non segna','#06b6d4','👟',`<h4>Segna almeno 1 gol</h4><div class="odds">${srt('sc')}</div>`+(M.nsc?`<h4>Non segna</h4><div class="odds">${srt('nsc')}</div>`:'')],
   ['mu','Doppietta, tripletta, poker','#ec4899','🔥',M.dbl?[['dbl','Doppietta (2+ gol)'],['tri','Tripletta (3+ gol)'],['pok','Poker (4+ gol)']].map(([mk,t])=>`<h4>${t}</h4><div class="odds">${srt(mk)}</div>`).join(''):''],
   ['fs','Primo marcatore','#eab308','🥇',M.fs?`<div class="odds">${srt('fs')}</div>`:''],
   ['sp','Speciali Ignoranza &amp; Calcetto','#f97316','🤪',M.sp?`<div class="odds">${Object.keys(M.sp).filter(k=>SPX[k]).map(k=>O('sp',k+'|si',SPX[k]+': Sì',M.sp[k].si)+O('sp',k+'|no',SPX[k]+': No',M.sp[k].no)).join('')}</div><p class="small muted" style="margin:6px 0 0">L&rsquo;autogol si liquida da solo dalle colonne Autogol del risultato; ribaltone, portiere e primo marcatore li inserisce un admin (se il primo marcatore non viene indicato, la puntata viene rimborsata).<br><b>Ribaltone</b>: una squadra va sotto di 3 gol e finisce avanti di 1 (es. da 0-3 a 4-3).</p>`:'']];
  return head+`<div class="chips">${L.map(m=>`<button data-act="betSel" data-id="${esc(m.id)}" class="${m.id===sel.id?'on':''}">${esc(m.title)} &middot; ${esc(fmt(m.at).split(',').slice(0,2).join(','))}</button>`).join('')}</div>
  <div class="panel"><div class="row between"><div><h3 style="font-size:20px">${esc(sel.title)}</h3><div class="muted small">${esc(fmt(sel.at))}${sel.place?' &middot; '+esc(sel.place):''}</div></div><span class="pill ${open?'open':''}">${open?'Scommesse aperte':esc(why||'Chiuse')}</span></div>
  <p class="small muted" style="margin:10px 0 0">${tlg(sel,'A').replace('class="tl"','class="tl" style="display:inline;width:20px;height:20px;margin:0 4px 0 0;vertical-align:middle"')}<b style="color:var(--blue)">${esc(tn(sel,'A'))}</b>: ${od.A.map(nm).map(esc).join(', ')}<br><b style="color:var(--red)">${esc(tn(sel,'B'))}</b>: ${od.B.map(nm).map(esc).join(', ')}</p>
  <div style="margin-top:14px">${cats.map(([k,t,c,ic,body])=>body?`<div class="bcat" style="--c:${c}"><button class="bh" data-act="betCat" data-k="${k}" aria-expanded="${bo(k)}"><span class="bi">${ic}</span><span class="bt">${t}</span><i>${bo(k)?'&minus;':'+'}</i></button>${bo(k)?`<div class="bb">${body}</div>`:''}</div>`:'').join('')}</div>
  <p class="small muted" style="margin:0">Le quote nascono da overall delle squadre, risultati delle partite giocate (vittorie e pareggi dei giocatori), forma, gol storici e media gol delle partite. Puntata massima ${CR.maxBet} crediti. Vincita = puntata &times; quota. I crediti sono solo per giocare tra amici.</p></div>
  ${myBetsHTML(mine)}
  ${others.length?`<div class="panel" style="margin-top:16px"><h3>Schedina del gruppo su questa partita</h3><div class="tw"><table><tr><th>Chi</th><th>Giocata</th><th>Crediti</th><th>Quota</th></tr>${others.map(b=>`<tr><td>${esc(voterName(b.uid))}</td><td>${esc(pickLabel(b))}</td><td>${b.stake}</td><td>${(oddOf(b)||0).toFixed(2)}</td></tr>`).join('')}</table></div></div>`:''}`}
function myBetsHTML(mine){return `<div class="panel" style="margin-top:16px"><h3>Le tue scommesse</h3>${mine.length?`<div class="tw"><table><tr><th>Partita</th><th>Giocata</th><th>Puntata</th><th>Quota</th><th>Esito</th><th></th></tr>${mine.map(b=>{const i=betInfo(b),m=S.matches.find(x=>x.id===b.matchId);
  return `<tr><td>${esc(m?m.title:'(partita eliminata)')}</td><td>${esc(pickLabel(b))}</td><td>${b.stake}</td><td>${i.q?i.q.toFixed(2):'-'}</td><td class="st-${i.st==='void'?'open':i.st}">${{open:'In corso',won:'Vinta +'+i.pay,lost:'Persa',void:'Rimborsata'}[i.st]}</td><td>${i.st==='open'&&betsOpen(m)?`<button class="btn r sm" data-act="delBet" data-id="${esc(b.id)}" data-confirm="Annullare?">&times;</button>`:''}</td></tr>`}).join('')}</table></div>`:'<p class="muted small" style="margin-top:8px">Non hai ancora scommesso.</p>'}</div>`}
function betModal(mid,mk,pk){const m=S.matches.find(x=>x.id===mid),b={matchId:mid,market:mk,pick:pk},q=oddOf(b);if(!m||q==null)return;

  modal(`<h2>La tua puntata</h2><p style="margin-top:8px"><b>${esc(pickLabel(b))}</b> a quota <b style="color:var(--gold)">${fnum(q)}</b></p><p class="muted small">${esc(m.title)} &middot; hai ${bal} crediti</p>

function betPanel(m){if(!isAdmin())return '';const od=S.odds[m.id],nb=S.bets.filter(b=>b.matchId===m.id).length,ready=(m.A||[]).length&&(m.B||[]).length&&m.status!=='played',prev=!od&&ready?calcOdds(m):null,show=od||prev;

   const b={matchId:f.dataset.mid,market:f.dataset.mk,pick:f.dataset.pk},q=oddOf(b),stake=parseInt($('#bs').value,10),max=Math.min(CR.maxBet,credits(S.me.id).balance);

   await dref('bets/'+rid()).set({uid:S.me.id,...b,stake,createdAt:Date.now()});closeModal();toast('Puntata piazzata: in bocca al lupo!')},

 settings:async f=>{if(!S.me.owner)return;await dref('config/settings').set({satispay:$('#st_sp').value.trim(),purchaseOn:$('#st_on').checked,inviteUrl:$('#st_inv').value.trim()});toast('Impostazioni salvate')},
 video:async f=>{const id=$('#vm').value,m=S.matches.find(x=>x.id===id);if(!m)return;const fl=$('#vf')&&$('#vf').files[0],yl=$('#vy').value.trim();let v=null;
   if(fl){if(!S.assets)return toast('Caricamento file non disponibile',true);if(!/^video\//.test(fl.type))return toast('Scegli un file video',true);if(fl.size>20*1024*1024)return toast('Il file supera 20 MB: caricalo su YouTube e incolla il link',true);
     toast('Caricamento in corso...');let r;try{r=await S.assets.upload(fl)}catch(e){return toast('Caricamento non riuscito'+(e&&e.code?' ('+e.code+')':''),true)}
     v={url:r.url,aid:r.id,name:fl.name.slice(0,60)}}
   else if(yl){const y=ytId(yl);if(!y)return toast('Link YouTube non valido',true);v={yt:y}}
   else return toast('Inserisci un link YouTube o scegli un file',true);

 wall:async f=>{const v=$('#wt').value.trim();if(!v)return;const mp=myPlayer();await dref('wall/'+rid()).set({uid:S.me.id,name:(mp&&mp.name)||S.me.name||'?',text:v.slice(0,140),at:Date.now()});$('#wt').value=''},
 team:async f=>{const n=$('#tm_n').value.trim();if(!n)return;const id=$('#tm_id').value||rid();await dref('teams/'+id).set({name:n,logo:(S.tl||{}).T||'',updatedAt:Date.now()});toast('Squadra salvata');teamsModal()},
 tnames:async f=>{const a=$('#tn_a').value.trim(),b=$('#tn_b').value.trim();if(a&&b&&a.toLowerCase()===b.toLowerCase())return toast('Le due squadre devono avere nomi diversi',true);await dref('matches/'+S.matchId).update({nA:a,nB:b,lA:(S.tl||{}).A||'',lB:(S.tl||{}).B||''});closeModal();toast('Nomi squadre salvati')},
 tile:async f=>{const d=S.tdraft;if(!d||!S.me.id)return;const o={};const t=$('#tt_title').value.trim().slice(0,20),ic=$('#tt_icon').value.trim().slice(0,4);
   if(t)o.title=t;o.icon=ic;o.grad=d.grad;if(d.grad==='custom'){o.c1=$('#tt_c1').value;o.c2=$('#tt_c2').value}if(d.img)o.img=d.img;
   await saveHome({...(S.home.tiles||{}),[d.id]:o});closeModal();toast('Riquadro salvato')},
 profile:async f=>{const me=myPlayer();if(!me||me.id!==f.dataset.id)return;const name=$('#pr_name').value.trim();if(!name)return toast('Il nome non può essere vuoto',true);

   closeModal()},
 vote:async f=>{if(!S.me.id)return toast('Serve un account per votare',true);const v={};for(const k of SK)v[k]=parseInt(f.elements[k].value,10);const cur={...(S.ratings[S.me.id]||{})};cur[f.dataset.id]=v;await dref('ratings/'+S.me.id).set({v:cur});toast('Voti salvati');closeModal()},
 poll:async f=>{const opts=[...document.querySelectorAll('.plo')].map(i=>i.value).filter(Boolean);if(!opts.length)return toast('Aggiungi almeno un giorno e orario',true);
   await dref('polls/'+rid()).set({title:$('#pl_t').value.trim()||'Calcetto',status:'open',options:[...new Set(opts)].sort().map(at=>({id:rid(),at})),createdAt:Date.now()});closeModal();toast('Sondaggio lanciato')},
 match:async f=>{const mid=rid();await dref('matches/'+mid).set({title:$('#mt').value.trim()||'Calcetto',at:$('#md').value||'',place:$('#ml').value.trim(),...($('#mna').value.trim()?{nA:$('#mna').value.trim()}:{}),...($('#mnb').value.trim()?{nB:$('#mnb').value.trim()}:{}),status:'planned',players:[],A:[],B:[],createdAt:Date.now()});closeModal();S.matchId=mid;S.draft=null;render()},
 parts:async f=>{const ids=[...f.querySelectorAll('input:checked')].map(i=>i.value);const st=matchState();
   await dref('matches/'+S.matchId).update({players:ids,A:st.A.filter(x=>ids.includes(x)),B:st.B.filter(x=>ids.includes(x))});S.draft=null;closeModal()},
 result:async f=>{const st=matchState(),sa=parseInt($('#sa').value,10)||0,sb=parseInt($('#sb').value,10)||0,stats={},tot={A:{g:0,a:0,o:0},B:{g:0,a:0,o:0}};
   f.querySelectorAll('input[data-p]').forEach(i=>{const id=i.dataset.p,v=Math.max(0,parseInt(i.value,10)||0),side=st.A.includes(id)?'A':'B';(stats[id]??={g:0,a:0,o:0})[i.dataset.k]=v;tot[side][i.dataset.k]+=v});
   for(const [side,sc,opp] of [['A',sa,'B'],['B',sb,'A']]){const real=sc-tot[opp].o;if(real<0||tot[side].g>real||tot[side].a>real)return toast(`Gol, assist e autogol non tornano con il punteggio della squadra ${side==='A'?tn(st.m,'A'):tn(st.m,'B')} (${sc})`,true)}
   const clean={};for(const [id,v] of Object.entries(stats)){const w={};if(v.g)w.g=v.g;if(v.a)w.a=v.a;if(v.o)w.o=v.o;if(Object.keys(w).length)clean[id]=w}
   const {id:_id,...rest}=st.m;const spx={};if(f.querySelector('[data-sp]')){f.querySelectorAll('[data-sp]').forEach(c=>{spx[c.dataset.sp]=c.checked});const fv=$('#sfirst').value;if(fv)spx.first=fv}
   const nr={...rest,sa,sb,stats:clean,status:'played'};if(Object.keys(spx).length)nr.special=spx;else delete nr.special;
   await dref('matches/'+S.matchId).set(nr);closeModal();toast('Risultato salvato')}
};
window.addEventListener('scroll',()=>{const y=window.scrollY,b=document.body.classList;if(y>160)b.add('sc');else if(y<12)b.remove('sc')},{passive:true});
document.addEventListener('change',e=>{const i=e.target;if(i.matches&&i.matches('select[data-act=tlPickSel]'))return ACT.tlPick(i);if(!i.matches||!i.matches('input[data-logo]')||!i.files[0])return;const k=i.dataset.logo,f=i.files[0];
  if(!/^image\//.test(f.type))return toast('Scegli un\u2019immagine',true);
  const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const c=document.createElement('canvas'),r=Math.min(1,160/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const u=encode(c,true);if(u.length>120000)return toast('Immagine troppo pesante',true);S.tl=S.tl||{};S.tl[k]=u;const p=$('#tp_'+k);if(p){p.src=u;p.style.display=''}}finally{URL.revokeObjectURL(url)}};
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Immagine non leggibile',true)};im.src=url});

  if(t.dataset.confirm&&t.dataset.armed!=='1'){t.dataset.armed='1';const o=t.innerHTML;t.textContent=t.dataset.confirm;clearTimeout(t._t);t._t=setTimeout(()=>{t.dataset.armed='';t.innerHTML=o},3500);return}
  const f=ACT[t.dataset.act];if(f)wr(()=>f(t,e))});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();wr(()=>FORMS[f.dataset.form](f))});

  if(t.type==='range'&&t.nextElementSibling)t.nextElementSibling.textContent=t.value;
  if(t.id==='pf_tol')recut();
  if(S.tdraft&&(t.id==='tt_title'||t.id==='tt_icon'||t.id==='tt_c1'||t.id==='tt_c2')){const d=S.tdraft;if(t.id==='tt_title')d.title=t.value;if(t.id==='tt_icon')d.icon=t.value;
    if(t.id==='tt_c1'||t.id==='tt_c2'){d.c1=$('#tt_c1').value;d.c2=$('#tt_c2').value;d.grad='custom';d.img='';document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.g==='custom'))}tilePrev()}
  if(t.id==='bs'&&t.form){const q=+t.form.dataset.q,w=$('#bw');if(w)w.innerHTML='Vincita possibile: <b>'+Math.round((parseInt(t.value,10)||0)*q)+'</b> crediti'}
  if(t.id==='te'){const w=$('#tc');if(w)w.innerHTML='Riceverai <b>'+((parseInt(t.value,10)||0)*CR.perEuro)+'</b> crediti'}
  if(t.id==='ed_size')ED.size=+t.value;
  if(t.id==='ed_zoom'){ED.zoom=+t.value;edLayout()}
  if(t.id==='q'){S.q=t.value;const g=$('#pgrid');if(g)g.innerHTML=gridHTML()}});

  if(t.id==='tt_img'&&t.files&&t.files[0]&&S.tdraft){try{S.tdraft.img=await tileImage(t.files[0]);tilePrev()}catch(err){toast('Immagine non leggibile',true)}}

    S.vsrc=null;S.src=toCanvas(im,360);S.seed=null;
    $('#pf_cutbox').style.display='block';$('#pf_cur').style.display='none';$('#pf_orig').src=encode(S.src,false);const c=$('#pf_cutchk');if(c)c.checked=true;recut(true)}catch(err){toast('Immagine non leggibile',true)}}});

<script>
  const firebaseConfig = {
    apiKey: "INCOLLA_QUI_LA_TUA_API_KEY",
    authDomain: "INCOLLA_QUI.firebaseapp.com",
    projectId: "INCOLLA_QUI_PROJECT_ID",
    storageBucket: "INCOLLA_QUI.appspot.com",
    messagingSenderId: "INCOLLA_QUI",
    appId: "INCOLLA_QUI"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  window.S = {
    db: db,
    user: null,
    me: { id: 'user_' + Math.random().toString(36).slice(2, 8), owner: true, name: 'Amministratore', avatar: '' },
    ro: false,
    state: 'ok',
    tab: 'home',
    bets: [],
    odds: {},
    topups: [],
    topupOk: [],
    cfg: {},
    betMatch: null,
    home: {},
    tedit: false,
    tdraft: null,
    players: [],
    teams: [],
    wall: [],
    ratings: {},
    answers: {},
    polls: [],
    matches: [],
    admins: [],
    prof: {},
    q: '',
    sort: 'ovr',
    rk: 'pts',
    matchId: null,
    draft: null,
    pend: undefined,
    askedProfile: false
  };

  const col = n => S.db.collection(n), dref = p => S.db.doc(p);

  const sub = (ref, key, fn) => ref.onSnapshot(s => { fn(s); S.ready[key] = 1; if (typeof changed === 'function') changed(); if (typeof loadProfiles === 'function') loadProfiles(); }, err => {
    if (err && err.code !== 'unavailable') console.error(err);
  });

  S.ready = {};
  sub(col('players'), 'players', s => { S.players = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('ratings'), 'ratings', s => { S.ratings = Object.fromEntries(s.docs.map(d => [d.id, (d.data() || {}).v || {}])); });
  sub(col('answers'), 'answers', s => { S.answers = Object.fromEntries(s.docs.map(d => [d.id, (d.data() || {}).a || {}])); });
  sub(col('polls'), 'polls', s => { S.polls = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('matches'), 'matches', s => { S.matches = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('wall'), 'wall', s => { S.wall = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('teams'), 'teams', s => { S.teams = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '')); });
  sub(col('bets'), 'bets', s => { S.bets = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('odds'), 'odds', s => { S.odds = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); });
  sub(col('topups'), 'topups', s => { S.topups = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  sub(col('topupOk'), 'topupOk', s => { S.topupOk = s.docs.map(d => ({ id: d.id, ...d.data() })); });
  
  if (S.me.id) sub(dref('data/users/' + S.me.id + '/home'), 'home', s => { S.home = s.exists ? (s.data() || {}) : {}; });
  sub(dref('config/settings'), 'cfg', s => { S.cfg = s.exists ? (s.data() || {}) : {}; });
  sub(dref('config/admins'), 'admins', s => { S.admins = s.exists ? (s.data().ids || []) : []; });

  if (typeof render === 'function') render();
  if (typeof tick === 'function') setInterval(tick, 1000);
</script>
